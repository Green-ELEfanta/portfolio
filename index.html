<head>

<meta property="og:description" content="Video portfolio: AI UGC, short dramas, hook variations, motion graphics, localization.">
<meta property="og:image" content="showreel.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0c0e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='18' fill='%23d9b770'%3EAK%3C/text%3E%3C/svg%3E">
<title>Artsiom Kobyzev Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: cinema-dark first screen with a triptych showreel, then a work index of 9:16 tiles with filters, a hooks lab strip, a 17-language switcher, a short process row, contact. */
:root{
  --bg:#0c0c0e;--bg2:#131316;--card:#17171b;--line:rgba(255,255,255,.09);--fg:#f1eee7;--muted:#9a968e;--dim:#5e5b55;
  --accent:#d9b770;--accent-ink:#17120a;--glass:rgba(12,12,14,.72);
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f2ed;--bg2:#ffffff;--card:#ffffff;--line:rgba(20,20,22,.1);--fg:#141416;--muted:#67635c;--dim:#a19d95;
  --accent:#8a6a1e;--accent-ink:#ffffff;--glass:rgba(244,242,237,.78);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f2ed;--bg2:#ffffff;--card:#ffffff;--line:rgba(20,20,22,.1);--fg:#141416;--muted:#67635c;--dim:#a19d95;
  --accent:#8a6a1e;--accent-ink:#ffffff;--glass:rgba(244,242,237,.78);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:1360px;margin:0 auto}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:400}
.serif{font-family:var(--display)}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand small{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;gap:22px;font-size:13.5px;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.ctl{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;font-family:var(--mono);font-size:11.5px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.icon{width:32px;height:32px;border:1px solid var(--line);border-radius:999px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon:hover{color:var(--fg)}
.icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.hero{padding-block:56px 24px}
.hero h1{font-size:clamp(40px,6.4vw,96px);line-height:.98;letter-spacing:-.025em;max-width:16ch;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .sub{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:flex-end;justify-content:space-between;margin-top:26px}
.hero p{margin:0;max-width:58ch;color:var(--muted);font-size:16px}
.proof{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.proof b{color:var(--fg);font-weight:500}
.reel{position:relative;margin-top:34px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);
  transform-origin:50% 0;will-change:transform,opacity}
.reel video{width:100%;height:100%;object-fit:cover;display:block}
.reel .hud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.reel .hud > *{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-size:12.5px;font-family:var(--mono);cursor:pointer;backdrop-filter:blur(8px)}
.pill:hover{background:rgba(0,0,0,.75)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* sections */
section{padding-block:72px 8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.sh h2{font-size:clamp(30px,3.6vw,46px);letter-spacing:-.02em;line-height:1.05}
.sh h2 em{font-style:italic;color:var(--accent)}
.sh p{margin:0;color:var(--muted);max-width:52ch;font-size:14.5px}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:12px}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.grid.sel{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;padding:0;text-align:left;display:block;width:100%;
  transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .3s}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile video{opacity:0;transition:opacity .35s}
.tile.playing video{opacity:1}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tile .cap b{font-weight:600;font-size:12.5px;line-height:1.3;letter-spacing:-.005em}
.tile .cap span{font-family:var(--mono);font-size:11px;opacity:.75;flex:none}
.tile .badge{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:4px 8px;border-radius:999px}
@media (hover:hover){.tile:hover{transform:translateY(-4px);border-color:var(--accent)}}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center;transition:all .2s}
.chip small{font-family:var(--mono);font-size:11px;opacity:.7}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* hooks lab */
.lab{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.lab .tile .cap b{font-family:var(--mono);font-weight:500;font-size:11.5px}

/* languages */
.langwrap{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:36px;align-items:start}
.langwrap .player{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);max-width:100%}
.langwrap .player video{width:100%;height:100%;object-fit:cover;display:block}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:12.5px;min-width:54px}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.langs button:hover{border-color:var(--muted);color:var(--fg)}
.langnote{color:var(--muted);font-size:14.5px;max-width:52ch;margin:0 0 18px}
.langtitle{font-size:28px;letter-spacing:-.01em;margin-bottom:8px}
.langmeta{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:14px}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{border-top:1px solid var(--line);padding-top:16px}
.step i{font-family:var(--display);font-style:italic;font-size:34px;color:var(--accent);display:block;line-height:1;margin-bottom:10px}
.step b{display:block;font-weight:600;margin-bottom:6px}
.step p{margin:0;color:var(--muted);font-size:13.5px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.tools i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 9px}

/* contact */
.contact{padding-block:80px 56px;border-top:1px solid var(--line);margin-top:70px;display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:end}
.contact h2{font-size:clamp(34px,4.6vw,64px);letter-spacing:-.025em;line-height:1}
.contact h2 em{font-style:italic;color:var(--accent)}
.mail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.mail code{font-family:var(--mono);font-size:clamp(15px,2vw,22px);user-select:all}
.copy{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11.5px;border-radius:6px;padding:6px 10px;cursor:pointer}
.links{display:flex;flex-direction:column;gap:10px;font-size:14.5px;color:var(--muted)}
.links a{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.links a:hover{color:var(--fg)}
.foot{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding-block:18px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* reveal */
.rv{opacity:0;transform:translateY(22px);filter:blur(6px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1),filter .8s}
.rv.in{opacity:1;transform:none;filter:none}
.no-js .rv,.reduced .rv{opacity:1;transform:none;filter:none;transition:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(6,6,8,.94);z-index:60;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none!important}
.stage{display:grid;place-items:center;min-width:0;min-height:0}
.stage video{height:calc(100vh - 36px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:100%;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:14px}
.side{display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.side .k{color:#8d8a83}
.side h3{font-size:30px;letter-spacing:-.015em;line-height:1.1}
.side .meta{font-family:var(--mono);font-size:12px;color:#a5a29b}
.side .tg{display:flex;flex-wrap:wrap;gap:6px}
.side .tg i{font-style:normal;font-family:var(--mono);font-size:11.5px;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:4px 9px;color:#ddd}
.side .langs button{color:#bbb;border-color:rgba(255,255,255,.18)}
.navb{display:flex;gap:8px;margin-top:6px}
.pb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;padding:10px 16px;border-radius:9px;cursor:pointer;font-size:13px}
.pb:hover{background:rgba(255,255,255,.14)}
.pb.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px));z-index:61;width:40px;height:40px;padding:0;border-radius:50%}

@media (max-width:980px){
  .nav{display:none}
  .lab{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .langwrap{grid-template-columns:1fr}
  .langwrap .player{max-width:360px}
  .contact{grid-template-columns:1fr}
  .modal{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .stage video{height:auto;max-height:60vh}
  .side{justify-content:flex-start}
}
@media (max-width:560px){
  .grid,.grid.sel{grid-template-columns:repeat(2,1fr);gap:10px}
  .lab{grid-template-columns:repeat(2,1fr)}
  .hero{padding-block:36px 16px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none;filter:none}.tile{transition:none}}
</style>
</head>

  const ml=e.target.closest("#mLangs button");if(ml){const i=list[cur];const g=DATA.lang_groups[i.id];const id=g[ml.dataset.l];const v=$("#mv");v.src=blob(REF(id).v);v.play().catch(()=>{});$("#mLangs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===ml));return}
  const td=e.target.closest(".tile");if(td){openModal(td);return}
  const cp=e.target.closest("#copy");if(cp){const v="3602921@gmail.com";const done=()=>{cp.textContent=T[lang].copied;setTimeout(()=>cp.textContent=T[lang].copy,1500)};const sel=()=>{const r=document.createRange();r.selectNodeContents(cp.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,sel);else sel();return}
});
$("#snd").addEventListener("click",()=>{const v=$("#reelv");v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});$("#snd").querySelector("[data-i]").textContent=v.muted?T[lang].sound:T[lang].soundOff});
/* hover preview */
if(matchMedia("(hover:hover)").matches){
  let tm=null;
  document.addEventListener("mouseover",e=>{const td=e.target.closest(".tile");if(!td||td.classList.contains("playing"))return;clearTimeout(tm);tm=setTimeout(()=>{const v=td.querySelector("video");if(!v.src)v.src=v.dataset.src;v.currentTime=0;v.play().then(()=>td.classList.add("playing")).catch(()=>{})},160)});
  document.addEventListener("mouseout",e=>{const td=e.target.closest(".tile");if(!td||td.contains(e.relatedTarget))return;clearTimeout(tm);const v=td.querySelector("video");v.pause();td.classList.remove("playing")});
}
/* modal */
function openModal(td){
  const grid=td.closest("#labGrid")?"lab":td.closest("#selGrid")?"sel":"work";
  const ids=[...td.closest(".grid,.lab").querySelectorAll(".tile")].map(b=>b.dataset.id);
  list=ids.map(id=>BY[id]||Object.assign({id,dur:27,cat:"ugc",en:"Hook variant",ru:"Вариант хука"},DATA.extra[id]));
  if(grid==="lab")list=list.map((i,k)=>Object.assign({},i,{en:"Hook "+(k+1)+", same body",ru:"Хук "+(k+1)+", то же тело",tools:BY["755"].tools}));
  cur=Math.max(0,ids.indexOf(td.dataset.id));$("#modal").hidden=false;document.body.style.overflow="hidden";$("#reelv").pause();fillModal(true);$("#close").focus();
}
function fillModal(load){
  const i=list[cur],v=$("#mv"),t=T[lang];
  if(load&&v.dataset.id!==i.id){v.pause();v.src=blob(i.v);v.poster=blob(i.p);v.dataset.id=i.id;v.load();v.play().catch(()=>{})}
  $("#mCat").textContent=t.catName(i.cat);$("#mTitle").textContent=i[lang];
  $("#mMeta").textContent=`9:16 · ${fmt(i.dur)} · ${cur+1} / ${list.length}`;
  $("#mTools").innerHTML=(i.tools||[]).map(x=>`<i>${x}</i>`).join("");
  const g=DATA.lang_groups[i.id];const ml=$("#mLangs");
  if(g){ml.hidden=false;ml.innerHTML=Object.keys(g).map(l=>`<button type="button" data-l="${l}" aria-pressed="${l==="EN"}" title="${LANGNAME[l]}">${l}</button>`).join("")}else{ml.hidden=true;ml.innerHTML=""}
  $("#prev").textContent=t.prev;$("#next").textContent=t.next;
}
function closeModal(){const v=$("#mv");v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.dataset.id="";v.load();$("#modal").hidden=true;document.body.style.overflow="";$("#reelv").play().catch(()=>{})}
$("#close").addEventListener("click",closeModal);
$("#prev").addEventListener("click",()=>{cur=(cur-1+list.length)%list.length;fillModal(true)});
$("#next").addEventListener("click",()=>{cur=(cur+1)%list.length;fillModal(true)});
$("#mv").addEventListener("ended",()=>{cur=(cur+1)%list.length;fillModal(true)});
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal")||e.target.classList.contains("stage"))closeModal()});
document.addEventListener("keydown",e=>{if($("#modal").hidden)return;if(e.key==="Escape")closeModal();if(e.key==="ArrowRight")$("#next").click();if(e.key==="ArrowLeft")$("#prev").click()});
/* reveal + hero parallax */
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduced)document.documentElement.classList.add("reduced");
let io=null;
function observeAll(){
  if(reduced||!("IntersectionObserver" in window)){document.querySelectorAll(".rv,.tile").forEach(el=>el.classList.add("in"));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.08});
  document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el));
  document.querySelectorAll(".grid .tile:not(.rv), .lab .tile:not(.rv)").forEach((el,k)=>{el.classList.add("rv");el.style.transitionDelay=Math.min(k%8*45,320)+"ms";io.observe(el)});
}
if(!reduced){let tick=false;addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const r=$("#reel");const y=Math.min(1,Math.max(0,scrollY/700));r.style.transform=`scale(${1-y*.06})`;r.style.opacity=1-y*.55;tick=false})},{passive:true})}
renderAll();applyThemeIcon();
</script>
